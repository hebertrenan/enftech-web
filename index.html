<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso ao Sistema</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <!-- Alternador de Telas sem JS (CSS Radio Hack) -->
    <input type="radio" id="tab-login" name="tab-control" checked>
    <input type="radio" id="tab-cadastro" name="tab-control">

    <nav class="abas">
      <label for="tab-login" class="aba">Entrar</label>
      <label for="tab-cadastro" class="aba">Cadastrar</label>
    </nav>

    <div class="conteudo">
      <!-- FORMULÁRIO DE LOGIN -->
      <form id="form-login" class="card-form">
        <h2>Bem-vindo de volta</h2>

        <div class="campo">
          <label for="login-email">E-mail</label>
          <input 
            type="email" 
            id="login-email" 
            name="email" 
            placeholder="seu@email.com" 
            required
          >
        </div>

        <div class="campo">
          <label for="login-senha">Senha</label>
          <input 
            type="password" 
            id="login-senha" 
            name="senha" 
            minlength="3" 
            placeholder="Sua senha" 
            required
          >
        </div>

        <button type="submit" class="btn">Entrar</button>
      </form>

      <!-- FORMULÁRIO DE CADASTRO -->
      <form id="form-cadastro" class="card-form">
        <h2>Criar Conta</h2>

        <div class="campo">
          <label for="cad-nome">Nome Completo</label>
          <input 
            type="text" 
            id="cad-nome" 
            name="nome" 
            placeholder="Seu nome" 
            required
          >
        </div>

        <div class="campo">
          <label for="cad-email">E-mail</label>
          <input 
            type="email" 
            id="cad-email" 
            name="email" 
            placeholder="seu@email.com" 
            required
          >
        </div>

        <div class="campo">
          <label for="cad-senha">Senha</label>
          <input 
            type="password" 
            id="cad-senha" 
            name="senha" 
            minlength="3" 
            placeholder="Sua senha" 
            required
          >
        </div>

        <button type="submit" class="btn">Cadastrar</button>
      </form>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
